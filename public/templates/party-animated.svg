<svg width="375" height="667" viewBox="0 0 375 667" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 黑色背景 -->
  <rect width="375" height="667" fill="#000000"/>
  
  <!-- 漸層拱門效果 -->
  <defs>
    <linearGradient id="archGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 拱門形狀 -->
  <ellipse cx="187.5" cy="667" rx="140" ry="200" fill="url(#archGradient)" opacity="0.9"/>
  
  <!-- 標題文字 -->
  <text x="187.5" y="280" font-family="serif" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">
    Welcome to
  </text>
  <text x="187.5" y="320" font-family="serif" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">
    the Party!
  </text>
  
  <!-- 裝飾元素 -->
  <circle cx="80" cy="150" r="8" fill="#fbbf24" opacity="0.8"/>
  <circle cx="295" cy="150" r="8" fill="#fbbf24" opacity="0.8"/>
  <circle cx="130" cy="120" r="6" fill="#fbbf24" opacity="0.6"/>
  <circle cx="245" cy="120" r="6" fill="#fbbf24" opacity="0.6"/>
  
  <!-- 底部表單提示 -->
  <rect x="37" y="520" width="300" height="80" rx="12" fill="#fef3c7" opacity="0.9"/>
  <text x="187.5" y="555" font-family="sans-serif" font-size="14" fill="#0f766e" text-anchor="middle">
